sonar.projectKey=xenit-eu_contentgrid-navigator-horizon
sonar.organization=xenit-eu
sonar.sources=apps,packages
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/test-setup.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Disable S7764 "Use globalThis instead of window/self/global".
# We intentionally use window/self/global in their respective runtime
# contexts; globalThis adds no value here. Disabled for both the JS and
# TS analyzers (packages/eslint-config/index.js is a real .js source).
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7764
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S7764
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

sonar.projectKey=xenit-eu_contentgrid-navigator-horizon
sonar.organization=xenit-eu
sonar.sources=apps,packages
# public/mockServiceWorker.js is generated vendor code (`msw init`), committed
# per MSW convention — not our source.
# routeTree.gen.ts is generated by @tanstack/router-plugin (never hand-edited);
# the two apps' trees are near-identical by design, so it must not count toward
# duplication/coverage/issues.
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/test-setup.*,**/public/mockServiceWorker.js,**/routeTree.gen.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Story files and Playwright test infrastructure are exercised by
# `pnpm test:storybook` / Playwright, not by Vitest coverage.
# Exclude them from coverage metrics only — they are still analyzed
# for bugs and code smells via sonar.sources above.
# src/mocks (dev-only MSW stubs) and main.tsx (app bootstrap) are exercised
# by the Playwright boot smoke test (HZN-4.7), not by Vitest.
sonar.coverage.exclusions=**/*.stories.tsx,**/tests/**,**/playwright*.config.ts,**/test-fixtures/**,**/src/mocks/**,**/main.tsx

# The generic and experimental apps are intentionally parallel scaffolds
# (ADR-006 three-track model): their bootstrap (main.tsx) and dev-mode mock
# wiring are near-identical twins by design, not copy-paste debt.
sonar.cpd.exclusions=apps/*/src/main.tsx,apps/*/src/mocks/**,apps/*/src/vite-env.d.ts

# Disable S7764 "Use globalThis instead of window/self/global".
# We intentionally use window/self/global in their respective runtime
# contexts; globalThis adds no value here. Disabled for both the JS and
# TS analyzers (packages/eslint-config/index.js is a real .js source).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7764
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S7764
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# S6479 "no array index in keys": the infinite-scroll demo's page list is
# append-only and the profile-inspector's loading-skeleton list is fixed-order
# and identity-less (no stable key exists). Index keys are the correct React
# pattern here; a synthetic key would be worse. Scoped to these two files only.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e3.resourceKey=**/entity-list/infinite-scroll-demo.tsx
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e4.resourceKey=**/profile-inspector/index.tsx

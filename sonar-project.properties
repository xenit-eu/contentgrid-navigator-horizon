sonar.projectKey=xenit-eu_contentgrid-navigator-horizon
sonar.organization=xenit-eu
sonar.sources=apps,packages
# public/mockServiceWorker.js is generated vendor code (`msw init`), committed
# per MSW convention — not our source.
# routeTree.gen.ts is generated by the TanStack Router Vite plugin.
# test-utils.* are shared test harnesses (render helpers for *.test.* files).
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/test-setup.*,**/test-utils.*,**/public/mockServiceWorker.js,**/routeTree.gen.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Story files and Playwright test infrastructure are exercised by
# `pnpm test:storybook` / Playwright, not by Vitest coverage.
# Exclude them from coverage metrics only — they are still analyzed
# for bugs and code smells via sonar.sources above.
# src/mocks (dev-only MSW stubs), main.tsx (app bootstrap) and src/routes/**
# (file-based route wiring) are exercised by the Playwright boot smoke and
# navigation E2E tests (HZN-4.7 / HZN-5.0), not by Vitest.
sonar.coverage.exclusions=**/*.stories.tsx,**/tests/**,**/playwright*.config.ts,**/test-fixtures/**,**/src/mocks/**,**/main.tsx,**/src/routes/**

# The generic and experimental apps are intentionally parallel scaffolds
# (ADR-006 three-track model): their bootstrap (main.tsx), dev-mode mock
# wiring and file-based routes are near-identical twins by design, not
# copy-paste debt. Storybook stories and MSW test fixtures are declarative,
# repetitive-by-nature showcase/test data, not production logic.
sonar.cpd.exclusions=apps/*/src/main.tsx,apps/*/src/mocks/**,apps/*/src/vite-env.d.ts,apps/*/src/routes/**,**/*.stories.tsx,**/test-fixtures/**

# Disable S7764 "Use globalThis instead of window/self/global".
# We intentionally use window/self/global in their respective runtime
# contexts; globalThis adds no value here. Disabled for both the JS and
# TS analyzers (packages/eslint-config/index.js is a real .js source).
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7764
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S7764
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

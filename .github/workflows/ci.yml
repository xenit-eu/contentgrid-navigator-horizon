name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHCR_PREFIX: ghcr.io/xenit-eu/contentgrid-navigator-horizon

jobs:
  lint-test-build:
    name: Lint, Test & Build (${{ matrix.app }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [navigator, navigator-experimental]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build eslint-config
        run: pnpm --filter @contentgrid/eslint-config build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter @contentgrid/eslint-config test

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm --filter ${{ matrix.app }}... run --if-present test

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          retention-days: 1

  docker:
    name: Docker (${{ matrix.app }})
    needs: lint-test-build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [navigator, navigator-experimental]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist

      - name: Login to GitHub Container Registry
        # Only needed to push. Renovate's read-only token can't push, and the
        # nginx base image is public, so the build itself needs no registry auth.
        if: ${{ github.actor != 'renovate[bot]' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate docker tags
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: |
            ${{ env.GHCR_PREFIX }}-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha
            type=raw,value=commit-${{ github.event.pull_request.head.sha }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: apps/${{ matrix.app }}
          # Build on every PR (validates the Dockerfile + dist packaging), but push
          # only for non-Renovate runs — Renovate PRs get a read-only token.
          push: ${{ github.actor != 'renovate[bot]' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  preview:
    name: Deploy Preview (${{ matrix.app }})
    needs: docker
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    strategy:
      matrix:
        app: [navigator, navigator-experimental]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: PR Preview - Kubectl install
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: "v1.30.5"

      - name: PR Preview - Kubernetes context
        uses: azure/k8s-set-context@ae59a723ba9abe7a9655538854a025448dbab4aa # v4
        with:
          method: kubeconfig
          kubeconfig: "${{ secrets.PREVIEW_KUBECONFIG }}"

      - name: PR Preview - Prepare manifests
        id: name-prep
        run: |
          PR_NAME="preview-pr-${{ github.event.number }}-hz-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}"
          PR_HOST="${{ github.event.number }}-hz-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}.preview.contentgrid.app"
          # Deploy an immutable per-commit tag so every push changes the Deployment pod spec and triggers a real rollout. A mutable :pr-N tag is byte-identical each commit, so K8s never rolls the pods and the preview goes stale.
          PR_IMAGE="${{ env.GHCR_PREFIX }}-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}:commit-${{ github.event.pull_request.head.sha }}"
          mkdir -p .preview-rendered
          cp .github/pr-previews/*.yml .preview-rendered/
          sed -i "s|{PR_NUMBER_PLACEHOLDER}|${PR_NAME}|g" .preview-rendered/*
          sed -i "s|{PR_HOST_PLACEHOLDER}|${PR_HOST}|g" .preview-rendered/*
          sed -i "s|{PR_ENV_NGINX_SERVICE_NAME}|configjs-nginx|g" .preview-rendered/*
          sed -i "s|{IMAGE_PLACEHOLDER}|${PR_IMAGE}|g" .preview-rendered/*
          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: PR Preview - Kubernetes deploy
        uses: azure/k8s-deploy@c8cfec839dc09896b3b8cc40cd13d04792680771 # v5
        with:
          namespace: "frontend-pr"
          manifests: ".preview-rendered"

      - name: Wait for rollout
        run: |
          DEPLOY="preview-pr-${{ github.event.number }}-hz-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}"
          kubectl -n frontend-pr rollout status deployment/"$DEPLOY" --timeout=120s

      - name: Diagnose failed rollout
        if: ${{ failure() || cancelled() }}
        run: |
          DEPLOY="preview-pr-${{ github.event.number }}-hz-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}"
          SELECTOR="app.kubernetes.io/component=${DEPLOY}"
          echo "::group::Pods"
          kubectl get pods -n frontend-pr -l "$SELECTOR" -o wide || true
          echo "::endgroup::"
          echo "::group::Recent events (namespace frontend-pr)"
          kubectl get events -n frontend-pr --sort-by=.lastTimestamp | tail -40 || true
          echo "::endgroup::"
          echo "::group::Pod describe"
          kubectl describe pod -n frontend-pr -l "$SELECTOR" || true
          echo "::endgroup::"
          echo "::group::Container logs (current)"
          kubectl logs -n frontend-pr -l "$SELECTOR" --tail=200 --all-containers=true --prefix=true || true
          echo "::endgroup::"
          echo "::group::Container logs (previous, if crashlooped)"
          kubectl logs -n frontend-pr -l "$SELECTOR" --tail=200 --all-containers=true --prefix=true --previous || true
          echo "::endgroup::"

  preview-comment:
    name: PR Preview Comment
    needs: preview
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    steps:
      - name: Post or update preview comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = ${{ github.event.number }};
            const date = new Date().toISOString().replace('T', ' ').substring(0, 19);

            const navigatorUrl = `https://${prNumber}-hz-navigator.preview.contentgrid.app/`;
            const experimentalUrl = `https://${prNumber}-hz-experimental.preview.contentgrid.app/`;

            const commentBody = [
              `Preview builds for this pull request have been deployed. Last updated at ${date} UTC.`,
              ``,
              `| App | URL |`,
              `| --- | --- |`,
              `| navigator | [${navigatorUrl}](${navigatorUrl}) |`,
              `| navigator-experimental | [${experimentalUrl}](${experimentalUrl}) |`,
              ``,
              `<!-- pr-preview-comment -->`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existing = comments.find(c => c.body.endsWith('<!-- pr-preview-comment -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        # Version comes from the root package.json "packageManager" field.
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Visual regression tests
        run: pnpm test:visual

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/storybook/playwright-report
          retention-days: 7

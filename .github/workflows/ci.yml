name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-build:
    name: Lint, Test & Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [navigator, navigator-experimental]
        include:
          - app: navigator
            image: ghcr.io/xenit-eu/contentgrid-navigator-horizon-navigator
            host_subdomain: navigator
          - app: navigator-experimental
            image: ghcr.io/xenit-eu/contentgrid-navigator-horizon-experimental
            host_subdomain: experimental
    outputs:
      tags-navigator: ${{ steps.meta-navigator.outputs.tags }}
      tags-navigator-experimental: ${{ steps.meta-navigator-experimental.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vite build cache
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/node_modules/.vite
          key: vite-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml', 'apps/${{ matrix.app }}/src/**') }}
          restore-keys: |
            vite-${{ matrix.app }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Visual tests
        run: pnpm test:visual

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          retention-days: 1

  docker:
    name: Docker (${{ matrix.app }})
    needs: lint-test-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [navigator, navigator-experimental]
        include:
          - app: navigator
            image: ghcr.io/xenit-eu/contentgrid-navigator-horizon-navigator
            host_subdomain: navigator
          - app: navigator-experimental
            image: ghcr.io/xenit-eu/contentgrid-navigator-horizon-experimental
            host_subdomain: experimental
    outputs:
      tags-navigator: ${{ steps.output-navigator.outputs.tags }}
      tags-navigator-experimental: ${{ steps.output-navigator-experimental.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha

      - name: Build and push docker image
        uses: docker/build-push-action@v7.1.0
        if: ${{ github.actor != 'dependabot[bot]' }}
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export tags (navigator)
        id: output-navigator
        if: ${{ matrix.app == 'navigator' }}
        run: echo "tags=${{ steps.meta.outputs.tags }}" >> "$GITHUB_OUTPUT"

      - name: Export tags (navigator-experimental)
        id: output-navigator-experimental
        if: ${{ matrix.app == 'navigator-experimental' }}
        run: echo "tags=${{ steps.meta.outputs.tags }}" >> "$GITHUB_OUTPUT"

  preview:
    name: Deploy Preview (${{ matrix.app }})
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    strategy:
      matrix:
        app: [navigator, navigator-experimental]
        include:
          - app: navigator
            image: ghcr.io/xenit-eu/contentgrid-navigator-horizon-navigator
            host_subdomain: navigator
          - app: navigator-experimental
            image: ghcr.io/xenit-eu/contentgrid-navigator-horizon-experimental
            host_subdomain: experimental
    steps:
      - uses: actions/checkout@v4

      - name: PR Preview - Kubectl install
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
        id: install

      - name: PR Preview - Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: '${{ secrets.PREVIEW_KUBECONFIG }}'

      - name: PR Preview - Prepare manifests
        id: name-prep
        run: |
          PR_NAME="preview-pr-${{ github.event.number }}-${{ matrix.host_subdomain }}"
          PR_HOST="${{ github.event.number }}-${{ matrix.host_subdomain }}.preview.contentgrid.app"
          PR_IMAGE="${{ matrix.image }}:pr-${{ github.event.number }}"
          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"
          sed -i "s|{PR_NUMBER_PLACEHOLDER}|${PR_NAME}|g" .github/pr-previews/*
          sed -i "s|{PR_HOST_PLACEHOLDER}|${PR_HOST}|g" .github/pr-previews/*
          sed -i "s|{PR_ENV_NGINX_SERVICE_NAME}|configjs-nginx|g" .github/pr-previews/*
          sed -i "s|{IMAGE_PLACEHOLDER}|${PR_IMAGE}|g" .github/pr-previews/*

      - name: PR Preview - Kubernetes deploy
        uses: azure/k8s-deploy@v5
        with:
          namespace: 'frontend-pr'
          manifests: '.github/pr-previews'

      - name: Restore manifests
        run: git restore .github/pr-previews/*

  preview-comment:
    name: PR Preview Comment
    needs: preview
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    steps:
      - name: Post or update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ github.event.number }};
            const date = new Date().toISOString().replace('T', ' ').substring(0, 19);

            const navigatorUrl = `https://${prNumber}-navigator.preview.contentgrid.app/`;
            const experimentalUrl = `https://${prNumber}-experimental.preview.contentgrid.app/`;

            const commentBody = [
              `Preview builds for this pull request have been deployed. Last updated at ${date} UTC.`,
              ``,
              `| App | URL |`,
              `| --- | --- |`,
              `| navigator | [${navigatorUrl}](${navigatorUrl}) |`,
              `| navigator-experimental | [${experimentalUrl}](${experimentalUrl}) |`,
              ``,
              `<!-- pr-preview-comment -->`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existing = comments.find(c => c.body.endsWith('<!-- pr-preview-comment -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      story_grep:
        description: >-
          Optional Playwright --grep pattern to scope re-baselining to a subset of
          stories (e.g. "primitives-popover"). Leave empty to regenerate every
          packages/ui baseline. Run this from the feature branch that needs new
          baselines, not main — the re-baseline job pushes directly to the
          triggering branch, which branch protection will reject on main.
        required: false
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHCR_PREFIX: ghcr.io/xenit-eu/contentgrid-navigator-horizon

jobs:
  lint-test-build:
    name: Lint, Test & Build (${{ matrix.app }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [navigator, navigator-experimental]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build eslint-config
        run: pnpm --filter @contentgrid/eslint-config build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter @contentgrid/eslint-config test

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm --filter ${{ matrix.app }}... run --if-present test

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          retention-days: 1

  sonar:
    name: SonarQube
    needs: lint-test-build
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eslint-config
        run: pnpm --filter @contentgrid/eslint-config build

      - name: Test with coverage
        run: pnpm test:coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8
        with:
          args: >
            -Dsonar.projectKey=xenit-eu_contentgrid-navigator-horizon
            -Dsonar.organization=xenit-eu
            -Dsonar.sources=apps,packages
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/test-setup.*,**/public/mockServiceWorker.js,**/routeTree.gen.ts
            -Dsonar.coverage.exclusions=**/*.stories.tsx,**/tests/**,**/playwright*.config.ts,**/test-fixtures/**,**/src/mocks/**,**/main.tsx
            -Dsonar.cpd.exclusions=apps/*/src/main.tsx,apps/*/src/mocks/**,apps/*/src/vite-env.d.ts,apps/*/src/routes/config.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.tsconfigPath=tsconfig.json
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker (${{ matrix.app }})
    needs: lint-test-build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [navigator, navigator-experimental]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate docker tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.GHCR_PREFIX }}-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha
            type=raw,value=commit-${{ github.event.pull_request.head.sha }},enable=${{ github.event_name == 'pull_request' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  preview:
    name: Deploy Preview (${{ matrix.app }})
    needs: docker
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        app: [navigator, navigator-experimental]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: PR Preview - Kubectl install
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: "v1.30.5"

      - name: PR Preview - Kubernetes context
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5
        with:
          method: kubeconfig
          kubeconfig: "${{ secrets.PREVIEW_KUBECONFIG }}"

      - name: PR Preview - Prepare manifests
        id: name-prep
        run: |
          PR_NAME="preview-pr-${{ github.event.number }}-hz-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}"
          PR_HOST="${{ github.event.number }}-hz-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}.preview.contentgrid.app"
          # Deploy an immutable per-commit tag so every push changes the Deployment pod spec and triggers a real rollout. A mutable :pr-N tag is byte-identical each commit, so K8s never rolls the pods and the preview goes stale.
          PR_IMAGE="${{ env.GHCR_PREFIX }}-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}:commit-${{ github.event.pull_request.head.sha }}"
          mkdir -p .preview-rendered
          cp .github/pr-previews/*.yml .preview-rendered/
          sed -i "s|{PR_NUMBER_PLACEHOLDER}|${PR_NAME}|g" .preview-rendered/*
          sed -i "s|{PR_HOST_PLACEHOLDER}|${PR_HOST}|g" .preview-rendered/*
          sed -i "s|{PR_ENV_NGINX_SERVICE_NAME}|configjs-nginx|g" .preview-rendered/*
          sed -i "s|{IMAGE_PLACEHOLDER}|${PR_IMAGE}|g" .preview-rendered/*
          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: PR Preview - Kubernetes deploy
        uses: azure/k8s-deploy@c7ebd0d5f39477a23f1b5dea0f52e6db04adf28e # v6
        with:
          namespace: "frontend-pr"
          manifests: ".preview-rendered"

      - name: Wait for rollout
        run: |
          DEPLOY="preview-pr-${{ github.event.number }}-hz-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}"
          kubectl -n frontend-pr rollout status deployment/"$DEPLOY" --timeout=120s

      - name: Diagnose failed rollout
        if: ${{ failure() || cancelled() }}
        run: |
          DEPLOY="preview-pr-${{ github.event.number }}-hz-${{ matrix.app == 'navigator-experimental' && 'experimental' || 'navigator' }}"
          SELECTOR="app.kubernetes.io/component=${DEPLOY}"
          echo "::group::Pods"
          kubectl get pods -n frontend-pr -l "$SELECTOR" -o wide || true
          echo "::endgroup::"
          echo "::group::Recent events (namespace frontend-pr)"
          kubectl get events -n frontend-pr --sort-by=.lastTimestamp | tail -40 || true
          echo "::endgroup::"
          echo "::group::Pod describe"
          kubectl describe pod -n frontend-pr -l "$SELECTOR" || true
          echo "::endgroup::"
          echo "::group::Container logs (current)"
          kubectl logs -n frontend-pr -l "$SELECTOR" --tail=200 --all-containers=true --prefix=true || true
          echo "::endgroup::"
          echo "::group::Container logs (previous, if crashlooped)"
          kubectl logs -n frontend-pr -l "$SELECTOR" --tail=200 --all-containers=true --prefix=true --previous || true
          echo "::endgroup::"

  preview-comment:
    name: PR Preview Comment
    needs: preview
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Post or update preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = ${{ github.event.number }};
            const date = new Date().toISOString().replace('T', ' ').substring(0, 19);

            const navigatorUrl = `https://${prNumber}-hz-navigator.preview.contentgrid.app/`;
            const experimentalUrl = `https://${prNumber}-hz-experimental.preview.contentgrid.app/`;

            const commentBody = [
              `Preview builds for this pull request have been deployed. Last updated at ${date} UTC.`,
              ``,
              `| App | URL |`,
              `| --- | --- |`,
              `| navigator | [${navigatorUrl}](${navigatorUrl}) |`,
              `| navigator-experimental | [${experimentalUrl}](${experimentalUrl}) |`,
              ``,
              `<!-- pr-preview-comment -->`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existing = comments.find(c => c.body.endsWith('<!-- pr-preview-comment -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

  # E2E tests are disabled until the application is feature-complete. Re-enable by removing
  # the `if: false` line below (HZN-5D.9).
  e2e:
    name: E2E tests (navigator)
    if: false
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Enable pnpm via corepack
        # Version comes from the root package.json "packageManager" field.
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox
        working-directory: apps/navigator

      - name: E2E tests
        run: pnpm test:e2e
        env:
          # Firefox refuses to launch when $HOME (/github/home) is not owned
          # by the current user in the Playwright container:
          # https://playwright.dev/docs/ci#github-actions-via-containers
          HOME: /root

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-e2e-report
          path: apps/navigator/playwright-report
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Enable pnpm via corepack
        # Version comes from the root package.json "packageManager" field.
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Visual regression tests
        run: pnpm test:visual

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: apps/storybook/playwright-report
          retention-days: 7

  visual-rebaseline:
    name: Re-baseline visual snapshots
    # Manual-only: never runs on push/pull_request. ADR-009 requires baselines to be
    # generated in this pinned container, never on a contributor's machine. Also
    # excludes main: the commit step pushes directly to the triggering ref, which
    # would bypass PR review on main if branch protection ever exempted this token.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    permissions:
      # Needed to push the re-baselined snapshots back to the triggering branch;
      # every other job stays read-only per the repo's least-privilege default.
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enable pnpm via corepack
        # Version comes from the root package.json "packageManager" field.
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate visual baselines
        env:
          STORY_GREP: ${{ inputs.story_grep }}
        run: |
          if [ -n "$STORY_GREP" ]; then
            pnpm --filter storybook run visual:update -- --grep "$STORY_GREP"
          else
            pnpm test:visual:update
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-rebaseline-report
          path: apps/storybook/playwright-report
          retention-days: 7

      - name: Commit updated baselines
        env:
          STORY_GREP: ${{ inputs.story_grep }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/tests/__snapshots__
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore: re-baseline visual snapshots${STORY_GREP:+ ($STORY_GREP)}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  accessibility:
    name: Accessibility audit (axe-core)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Enable pnpm via corepack
        # Version comes from the root package.json "packageManager" field.
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Accessibility audit
        run: pnpm test:a11y

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-a11y-report
          path: apps/storybook/playwright-report
          retention-days: 7
